<style>
/* Dithry: a Windows 95-style window, like Kartenspiel. Colours are tokens so dark mode can swap them. */
:root {
  --face: #c0c0c0; --hi: #ffffff; --lo: #808080; --dk: #000000; --text: #000000; --muted: #4a4a4a; --field: #ffffff;
  --title1: #000080; --title2: #1084d0; --titletext: #ffffff; --desk: #008080; --sel: #000080; --seltext: #ffffff; --work: #6b6b6b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --face: #3c3c3c; --hi: #6a6a6a; --lo: #1e1e1e; --dk: #000; --text: #e8e8e8; --muted: #b0b0b0; --field: #262626; --desk: #0b3d3d; --work: #2a2a2a; }
}
:root[data-theme="dark"] { --face: #3c3c3c; --hi: #6a6a6a; --lo: #1e1e1e; --dk: #000; --text: #e8e8e8; --muted: #b0b0b0; --field: #262626; --desk: #0b3d3d; --work: #2a2a2a; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--desk); color: var(--text); font: 13px/1.3 "DotGothic16", Tahoma, "MS Sans Serif", sans-serif; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
.raised { background: var(--face); border: 2px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi); box-shadow: inset -1px -1px 0 var(--lo); }
.sunken { border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); box-shadow: inset 1px 1px 0 var(--dk); }
.btn { background: var(--face); border: 2px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi); box-shadow: inset -1px -1px 0 var(--lo); padding: 2px 8px; min-height: 24px; cursor: pointer; }
.btn:active, .btn.on { border-color: var(--dk) var(--hi) var(--hi) var(--dk); box-shadow: inset 1px 1px 0 var(--lo); }
.btn:disabled { color: var(--lo); cursor: default; }
.btn.def { outline: 1px solid var(--dk); outline-offset: -4px; }

.win { position: fixed; inset: 4px; display: flex; flex-direction: column; padding: 2px; }
.titlebar { background: linear-gradient(90deg, var(--title1), var(--title2)); color: var(--titletext); display: flex; align-items: center; gap: 6px; padding: 3px 6px; font-weight: 700; font-size: 14px; flex: 0 0 auto; }
.titlebar .grow { flex: 1; }
.menubar { display: flex; gap: 2px; padding: 2px 2px; flex: 0 0 auto; position: relative; z-index: 20; }
.menubar > .mi { position: relative; }
.menubar > .mi > button { background: none; border: 1px solid transparent; padding: 2px 8px; cursor: pointer; }
.menubar > .mi.open > button, .menubar > .mi > button:hover { background: var(--sel); color: var(--seltext); }
.menu { position: absolute; left: 0; top: 100%; min-width: 230px; display: none; padding: 2px; z-index: 30; }
.mi.open .menu { display: block; }
.menu button { display: flex; width: 100%; justify-content: space-between; gap: 16px; background: none; border: 0; padding: 4px 18px 4px 22px; text-align: left; cursor: pointer; }
.menu button:hover:not(:disabled) { background: var(--sel); color: var(--seltext); }
.menu button:disabled { color: var(--lo); }
.menu button .k { opacity: .7; }
.menu hr { border: 0; border-top: 1px solid var(--lo); border-bottom: 1px solid var(--hi); margin: 3px 2px; }

.cardbar { display: flex; align-items: center; gap: 6px; padding: 4px 6px; flex-wrap: wrap; flex: 0 0 auto; }
.cardbar select { max-width: 260px; }
.cardbar .grow { flex: 1; }
.cardbar .narrow { display: none; }
.cardbar .btn.dirty { font-weight: 700; }
.btn.ink { font-weight: 700; min-width: 40px; }
.btn.ink.light { background: #2a2420; color: #f4efe2; }   /* shows the text colour the card will use */
.main { flex: 1; min-height: 0; display: flex; gap: 4px; padding: 2px; }
.toolbox { flex: 0 0 auto; width: 92px; padding: 4px; display: flex; flex-direction: column; gap: 6px; overflow: auto; }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.tool { width: 38px; height: 34px; padding: 0; display: grid; place-items: center; }
.tool svg { display: block; }
.opts { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.opts label { display: flex; align-items: center; gap: 4px; }
.opts .lbl { color: var(--muted); }
.work { flex: 1; min-width: 0; position: relative; overflow: hidden; background: var(--work); touch-action: none; }
.work.panning, .work.panning * { cursor: grab !important; }
#art { position: absolute; left: 0; top: 0; transform-origin: 0 0; image-rendering: pixelated; image-rendering: crisp-edges; box-shadow: 0 0 0 1px #000, 4px 4px 0 rgba(0, 0, 0, .35); }
#art.checker { background: repeating-conic-gradient(#cfcfcf 0 25%, #f4f4f4 0 50%) 0 0 / 8px 8px; }
#art.bg-white { background: #fff; } #art.bg-grey { background: #c0c0c0; } #art.bg-dark { background: #1c1f1f; }
#over { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }   /* sized by CSS: its bitmap is device pixels */

.side { flex: 0 0 300px; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
.panel { padding: 0 0 6px; }
.panel > .ph { background: var(--lo); color: #fff; font-weight: 700; padding: 2px 6px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.panel > .ph .grow { flex: 1; }
.panel.shut > .pb { display: none; }
.pb { padding: 6px 8px 0; display: flex; flex-direction: column; gap: 5px; }
.row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.slider { display: grid; grid-template-columns: 88px 1fr 46px; align-items: center; gap: 6px; }
.slider .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.ctl { display: grid; grid-template-columns: 88px 1fr; align-items: center; gap: 6px; }
.small { font-size: 11px; } .muted { color: var(--muted); }
#preview { width: 100%; height: 56px; image-rendering: pixelated; display: block; background: repeating-conic-gradient(#cfcfcf 0 25%, #f4f4f4 0 50%) 0 0 / 8px 8px; }

.ramp { display: flex; gap: 4px; align-items: center; }
.sw { width: 30px; height: 30px; padding: 0; border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); cursor: pointer; background-image: repeating-conic-gradient(#cfcfcf 0 25%, #f4f4f4 0 50%); background-size: 8px 8px; position: relative; }
.sw i { position: absolute; inset: 0; }
.sw.sel { outline: 2px dashed var(--text); outline-offset: 1px; }
.sw .n { position: absolute; left: 1px; bottom: -1px; font-size: 9px; color: #fff; text-shadow: 0 0 2px #000; }
.palette { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
.palette button { aspect-ratio: 1; padding: 0; border: 1px solid var(--dk); cursor: pointer; min-width: 0; background-image: repeating-conic-gradient(#cfcfcf 0 25%, #f4f4f4 0 50%); background-size: 6px 6px; position: relative; }
.palette button i { position: absolute; inset: 0; }

.layers { display: flex; flex-direction: column; gap: 1px; max-height: 210px; overflow: auto; background: var(--field); border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); }
.layer { display: grid; grid-template-columns: 20px 34px 1fr 20px; align-items: center; gap: 4px; padding: 2px 4px; cursor: pointer; }
.layer.act { background: var(--sel); color: var(--seltext); }
.layer canvas { width: 34px; height: 24px; image-rendering: pixelated; background: repeating-conic-gradient(#cfcfcf 0 25%, #f4f4f4 0 50%) 0 0 / 6px 6px; border: 1px solid var(--lo); }
.layer .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layer input { margin: 0; }
.ib { background: none; border: 0; padding: 0; cursor: pointer; font-size: 13px; }

.statusbar { display: flex; gap: 3px; flex: 0 0 auto; padding-top: 2px; }
.statusbar > div { padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.statusbar > .grow { flex: 1; }

.modalbg { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); display: grid; place-items: center; z-index: 50; padding: 12px; }
.modal { max-width: min(640px, 96vw); max-height: 92vh; display: flex; flex-direction: column; padding: 3px; }
.modal .body { padding: 10px 12px; overflow: auto; }
.modal .btns { display: flex; gap: 6px; justify-content: flex-end; padding: 0 12px 10px; flex-wrap: wrap; }
.modal h3 { margin: 10px 0 4px; font-size: 14px; }
.modal p { margin: 4px 0; }
.modal table { border-collapse: collapse; } .modal td { padding: 1px 10px 1px 0; vertical-align: top; }
.presetlist { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.presetlist .btn { text-align: left; }
.toast { position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%); padding: 6px 12px; z-index: 60; max-width: 90vw; pointer-events: none; }   /* taps go through it */

/* Parts only phones use; hidden on wider screens. */
.mtop, .mtabs, .sheethead { display: none; }
.polybar { display: none; position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); gap: 6px; z-index: 6; padding: 4px; white-space: nowrap; }
.sizer { display: flex; align-items: center; gap: 6px; } .sizer input { flex: 1; min-width: 70px; } .sizer b { min-width: 2ch; text-align: right; }
.tabsw { display: inline-flex; border: 1px solid var(--dk); } .tabsw i { width: 9px; height: 16px; display: block; }

  html, body { touch-action: manipulation; overscroll-behavior: none; }
  .win { inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); border: 0; box-shadow: none; }
  .titlebar, .menubar, .statusbar { display: none; }
  .mtop { display: flex; align-items: center; gap: 4px; padding: 4px; flex: 0 0 auto; }
  .mtop .mb { min-width: 44px; min-height: 40px; font-size: 18px; line-height: 1; padding: 0 8px; }
  .mtop .grow { flex: 1; }
  .mname { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .main { flex-direction: column; overflow: hidden; padding: 0 2px; gap: 2px; }
  .toolbox { width: auto; flex: 0 0 auto; padding: 3px; overflow: visible; }
  .toolbox .opts { display: none; }
  .tools { display: flex; overflow-x: auto; gap: 3px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .tools::-webkit-scrollbar { display: none; }
  .tool { flex: 0 0 auto; width: 46px; height: 42px; }
  .work { flex: 1 1 auto; min-height: 0; }
  .side { position: fixed; left: 0; right: 0; bottom: calc(56px + env(safe-area-inset-bottom)); max-height: 58vh; overflow: auto; display: none; z-index: 40; gap: 0;
    background: var(--face); border-top: 2px solid var(--hi); box-shadow: 0 -2px 0 var(--dk), 0 -6px 12px rgba(0, 0, 0, .25); padding: 0 0 8px; -webkit-overflow-scrolling: touch; }
  .side.open { display: flex; }
  .sheethead { display: flex; align-items: center; gap: 6px; padding: 6px 10px; position: sticky; top: 0; z-index: 2; background: var(--face); border-bottom: 1px solid var(--lo); font-size: 15px; }
  .sheethead .grow { flex: 1; }
  .side .panel { border: 0; box-shadow: none; }
  .side .panel > .ph { cursor: default; }
  .side .panel > .ph > span:first-child { display: none; }
  .side .pb { padding: 8px 12px 0; gap: 8px; }
  .side .opts { display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
  .mtabs { display: flex; gap: 3px; padding: 3px 3px calc(3px + env(safe-area-inset-bottom)); flex: 0 0 auto; }
  .mtabs .btn { flex: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 12px; padding: 2px; }
  .mtabs .btn svg { width: 18px; height: 18px; }
  /* bigger targets, and 16px text in fields so iPhones don't zoom the page when you tap one */
  input[type="number"], input[type="text"], select { font-size: 16px; min-height: 34px; }
  input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; }
  input[type="range"] { height: 30px; }
  .btn { min-height: 36px; }
  .slider { grid-template-columns: 96px 1fr 52px; }
  .ctl { grid-template-columns: 96px 1fr; }
  .sw { width: 42px; height: 42px; }
  .palette { grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .layers { max-height: none; }
  .layer { grid-template-columns: 28px 48px 1fr 36px; padding: 6px; min-height: 44px; }
  .layer canvas { width: 48px; height: 32px; }
  .menusheet { display: flex; flex-direction: column; gap: 10px; }
  .menusheet .msec { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .menusheet .msec > div { grid-column: 1 / -1; }
  .menusheet .btn { text-align: left; min-height: 42px; }
  .toast { bottom: auto; top: calc(env(safe-area-inset-top) + 98px); }   /* clear of the polygon bar and the sheets at the bottom */
  .polybar { bottom: 8px; }
  .polybar .btn { min-height: 40px; }
  .modal .body { font-size: 15px; }
  .cardbar { flex-wrap: nowrap; padding: 3px 4px; gap: 4px; }
  .cardbar .wide { display: none; } .cardbar .narrow { display: inline; }
  .cardbar select { flex: 1; min-width: 0; max-width: none; }
  .cardbar .btn { min-width: 40px; padding: 0 8px; }
  .cardbar [data-c="count"] { display: none; }
}
/* a phone on its side: less height, so slimmer bars and a taller sheet */
@media (max-height: 520px) {
  .mtop { padding: 2px 4px; } .mtop .mb { min-height: 32px; }
  .tool { height: 34px; width: 42px; }
  .mtabs .btn { min-height: 36px; flex-direction: row; gap: 6px; }
  .side { max-height: none; top: calc(env(safe-area-inset-top) + 40px); bottom: calc(44px + env(safe-area-inset-bottom)); left: auto; width: min(430px, 56vw); border-top: 0; border-left: 2px solid var(--hi); box-shadow: -2px 0 0 var(--dk), -6px 0 12px rgba(0, 0, 0, .25); }
  .cardbar { padding: 2px 4px; }
}

    var bg = D.rgba((c.type === 'Foundation' ? F.FOUND_BG : F.SUIT_BG)[c.suit] || '#ffffff', 1), t = F.texPixels(c.suit, c.id, w, h);
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var i = (y * w + x) * 4, j = (y * DW + x + ox) * 4, a = t[i + 3] / 255;
      dst[j] = Math.round(bg[0] * (1 - a) + t[i] * a); dst[j + 1] = Math.round(bg[1] * (1 - a) + t[i + 1] * a); dst[j + 2] = Math.round(bg[2] * (1 - a) + t[i + 2] * a); dst[j + 3] = 255;
    }
  }

  /* ----- saving to Kartenspiel ----- */
  function crop(flat, x0, w, h) { var out = new Uint8ClampedArray(w * h * 4); for (var y = 0; y < h; y++) out.set(flat.subarray((y * DW + x0) * 4, (y * DW + x0 + w) * 4), y * w * 4); return A.toCanvas(out, w, h).toDataURL('image/png'); }
  function save() {
    if (!cm) return;
    var c = cm.list[cm.i], flat = A.flatten(), mine = myFaces();
    mine[c.id] = { hand: crop(flat, 0, HW, HH), board: crop(flat, BX, BW, BH) }; if (cm.ink === 'light') mine[c.id].text = 'light';
    if (!A.lsSet('ks.faces', mine)) return A.toast('This browser’s storage is full, so the card couldn’t be saved. Export an art pack to keep your work.');
    A.lsSet('dithry.card.' + c.id, A.projectJSON());   // the layers, so you can keep working on them later
    app.dirty = false; A.renderTitle(); updateBar();
    A.toast('Saved “' + c.name + '” to Kartenspiel. Open Kartenspiel in this browser to see it (an open tab updates by itself).');
  }
  function resetCard() {
    var c = cm.list[cm.i], committed = typeof KCardArt !== 'undefined' && KCardArt[c.id];
    var m = A.modal('Reset “' + c.name + '”', '<p>This removes the painting you saved in this browser' + (committed ? '. The card goes back to the art that’s built into the game.' : ', and the card goes back to its plain suit texture.') + '</p>' +
      (committed ? '<label class="row"><input type="checkbox" id="rPlain"> Also hide the built-in art (use the plain texture)</label>' : ''),
      '<button class="btn" data-close>Cancel</button><button class="btn def" id="rGo">Reset</button>');
    $('#rGo', m).onclick = function () {
      var mine = myFaces(), plainToo = committed && $('#rPlain', m).checked; if (plainToo) mine[c.id] = null; else delete mine[c.id];
      A.lsSet('ks.faces', mine); try { localStorage.removeItem('dithry.card.' + c.id); } catch (e) { }
      A.closeModal(); app.dirty = false; load().then(function () { A.toast('Reset “' + c.name + '”.'); });
    };
  }

  /* ----- art packs: every painted card in one file ----- */
  function packDialog() {
    var all = F.faces(), n = Object.keys(all).length;
    var m = A.modal('Card art pack', '<p>' + n + ' card' + (n === 1 ? ' is' : 's are') + ' painted in this browser (including any built into the game).</p>' +
      '<p><b>Download</b> saves them all in one file: a backup, or a way to move them to another device or browser.</p>' +
      '<p>To put them in the game for <i>every</i> player, add the file to the repository with <code>node tools/cardart.js kartenspiel-card-art.json</code> and push: it writes <code>src/cardart.js</code>, which the site builds in.</p>',
      '<button class="btn" data-close>Close</button><button class="btn" id="pIn">Import…</button><button class="btn def" id="pOut"' + (n ? '' : ' disabled') + '>Download</button>');
    $('#pOut', m).onclick = function () {
      var blob = new Blob([JSON.stringify({ app: 'Kartenspiel card art', version: 1, faces: all })], { type: 'application/json' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'kartenspiel-card-art.json'; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      A.closeModal(); A.toast('Downloaded kartenspiel-card-art.json.');
    };
    $('#pIn', m).onclick = function () {
      var i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
      i.onchange = function () {
        var r = new FileReader(); r.onload = function () {
          try { var p = JSON.parse(r.result); if (!p || !p.faces) throw 0; var mine = myFaces(), k = 0; for (var id in p.faces) if (p.faces[id] && p.faces[id].hand && p.faces[id].board) { mine[id] = p.faces[id]; k++; }
            A.lsSet('ks.faces', mine); A.closeModal(); app.dirty = false; load(); A.toast('Imported ' + k + ' painted card' + (k === 1 ? '' : 's') + '.'); }
          catch (e) { A.toast('That file isn’t a card art pack.'); }
        }; r.readAsText(i.files[0]);
      };
      i.click();
    };
  }

  /* ----- wiring ----- */
  A.hooks.enter = function () { enter(); };
  A.hooks.leave = function () { if (cm && !cm.busy) leave(); };
  A.hooks.save = function () { save(); };
  A.hooks.start = function () { var m = /^#card(?:s|=(.+))$/.exec(location.hash); if (m) return enter(m[1] ? decodeURIComponent(m[1]) : null); };
  window.addEventListener('hashchange', function () { var m = /^#card=(.+)$/.exec(location.hash); if (m && (!cm || cm.list[cm.i].id !== decodeURIComponent(m[1]))) enter(decodeURIComponent(m[1])); });
  document.addEventListener('keydown', function (e) {
    if (!cm || $('#modal') || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === 'PageUp') { e.preventDefault(); step(-1); } else if (e.key === 'PageDown') { e.preventDefault(); step(1); }
  });
  window.DithryCards = { enter: enter, leave: leaveToPicture, save: save, goTo: goTo, step: step, current: function () { return cm && cm.list[cm.i]; }, size: [DW, DH, BX] };
})();
</script></body></html>
