<style>
/* Dithry: a Windows 95-style window, like Kartenspiel. Colours are tokens so dark mode can swap them. */
:root {
  --face: #c0c0c0; --hi: #ffffff; --lo: #808080; --dk: #000000; --text: #000000; --muted: #4a4a4a; --field: #ffffff;
  --title1: #000080; --title2: #1084d0; --titletext: #ffffff; --desk: #008080; --sel: #000080; --seltext: #ffffff; --work: #6b6b6b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --face: #3c3c3c; --hi: #6a6a6a; --lo: #1e1e1e; --dk: #000; --text: #e8e8e8; --muted: #b0b0b0; --field: #262626; --desk: #0b3d3d; --work: #2a2a2a; }
}
:root[data-theme="dark"] { --face: #3c3c3c; --hi: #6a6a6a; --lo: #1e1e1e; --dk: #000; --text: #e8e8e8; --muted: #b0b0b0; --field: #262626; --desk: #0b3d3d; --work: #2a2a2a; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--desk); color: var(--text); font: 13px/1.3 "DotGothic16", Tahoma, "MS Sans Serif", sans-serif; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
.raised { background: var(--face); border: 2px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi); box-shadow: inset -1px -1px 0 var(--lo); }
.sunken { border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); box-shadow: inset 1px 1px 0 var(--dk); }
.btn { background: var(--face); border: 2px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi); box-shadow: inset -1px -1px 0 var(--lo); padding: 2px 8px; min-height: 24px; cursor: pointer; }
.btn:active, .btn.on { border-color: var(--dk) var(--hi) var(--hi) var(--dk); box-shadow: inset 1px 1px 0 var(--lo); }
.btn:disabled { color: var(--lo); cursor: default; }
.btn.def { outline: 1px solid var(--dk); outline-offset: -4px; }
input[type="number"], input[type="text"], select { background: var(--field); border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); padding: 1px 3px; min-height: 22px; }
input[type="range"] { width: 100%; accent-color: var(--sel); margin: 0; }

.win { position: fixed; inset: 4px; display: flex; flex-direction: column; padding: 2px; }
.titlebar { background: linear-gradient(90deg, var(--title1), var(--title2)); color: var(--titletext); display: flex; align-items: center; gap: 6px; padding: 3px 6px; font-weight: 700; font-size: 14px; flex: 0 0 auto; }
.titlebar .grow { flex: 1; }
.menubar { display: flex; gap: 2px; padding: 2px 2px; flex: 0 0 auto; position: relative; z-index: 20; }
.menubar > .mi { position: relative; }
.menubar > .mi > button { background: none; border: 1px solid transparent; padding: 2px 8px; cursor: pointer; }
.menubar > .mi.open > button, .menubar > .mi > button:hover { background: var(--sel); color: var(--seltext); }
.menu { position: absolute; left: 0; top: 100%; min-width: 230px; display: none; padding: 2px; z-index: 30; }
.mi.open .menu { display: block; }
.menu button { display: flex; width: 100%; justify-content: space-between; gap: 16px; background: none; border: 0; padding: 4px 18px 4px 22px; text-align: left; cursor: pointer; }
.menu button:hover:not(:disabled) { background: var(--sel); color: var(--seltext); }
.menu button:disabled { color: var(--lo); }
.menu button .k { opacity: .7; }
.menu hr { border: 0; border-top: 1px solid var(--lo); border-bottom: 1px solid var(--hi); margin: 3px 2px; }

.main { flex: 1; min-height: 0; display: flex; gap: 4px; padding: 2px; }
.toolbox { flex: 0 0 auto; width: 92px; padding: 4px; display: flex; flex-direction: column; gap: 6px; overflow: auto; }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.tool { width: 38px; height: 34px; padding: 0; display: grid; place-items: center; }
.tool svg { display: block; }
.opts { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.opts label { display: flex; align-items: center; gap: 4px; }
.opts .lbl { color: var(--muted); }
.work { flex: 1; min-width: 0; position: relative; overflow: hidden; background: var(--work); touch-action: none; }
.work.panning, .work.panning * { cursor: grab !important; }
#art { position: absolute; left: 0; top: 0; transform-origin: 0 0; image-rendering: pixelated; image-rendering: crisp-edges; box-shadow: 0 0 0 1px #000, 4px 4px 0 rgba(0, 0, 0, .35); }
#art.checker { background: repeating-conic-gradient(#cfcfcf 0 25%, #f4f4f4 0 50%) 0 0 / 8px 8px; }
#art.bg-white { background: #fff; } #art.bg-grey { background: #c0c0c0; } #art.bg-dark { background: #1c1f1f; }
#over { position: absolute; inset: 0; pointer-events: none; }

.side { flex: 0 0 300px; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
.panel { padding: 0 0 6px; }
.panel > .ph { background: var(--lo); color: #fff; font-weight: 700; padding: 2px 6px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.panel > .ph .grow { flex: 1; }
.panel.shut > .pb { display: none; }
.pb { padding: 6px 8px 0; display: flex; flex-direction: column; gap: 5px; }
.row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.slider { display: grid; grid-template-columns: 88px 1fr 46px; align-items: center; gap: 6px; }
.slider .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.ctl { display: grid; grid-template-columns: 88px 1fr; align-items: center; gap: 6px; }
.small { font-size: 11px; } .muted { color: var(--muted); }
#preview { width: 100%; height: 56px; image-rendering: pixelated; display: block; background: repeating-conic-gradient(#cfcfcf 0 25%, #f4f4f4 0 50%) 0 0 / 8px 8px; }

.ramp { display: flex; gap: 4px; align-items: center; }
.sw { width: 30px; height: 30px; padding: 0; border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); cursor: pointer; background-image: repeating-conic-gradient(#cfcfcf 0 25%, #f4f4f4 0 50%); background-size: 8px 8px; position: relative; }
.sw i { position: absolute; inset: 0; }
.sw.sel { outline: 2px dashed var(--text); outline-offset: 1px; }
.sw .n { position: absolute; left: 1px; bottom: -1px; font-size: 9px; color: #fff; text-shadow: 0 0 2px #000; }
.palette { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
.palette button { aspect-ratio: 1; padding: 0; border: 1px solid var(--dk); cursor: pointer; min-width: 0; background-image: repeating-conic-gradient(#cfcfcf 0 25%, #f4f4f4 0 50%); background-size: 6px 6px; position: relative; }
.palette button i { position: absolute; inset: 0; }

.layers { display: flex; flex-direction: column; gap: 1px; max-height: 210px; overflow: auto; background: var(--field); border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); }
.layer { display: grid; grid-template-columns: 20px 34px 1fr 20px; align-items: center; gap: 4px; padding: 2px 4px; cursor: pointer; }
.layer.act { background: var(--sel); color: var(--seltext); }
.layer canvas { width: 34px; height: 24px; image-rendering: pixelated; background: repeating-conic-gradient(#cfcfcf 0 25%, #f4f4f4 0 50%) 0 0 / 6px 6px; border: 1px solid var(--lo); }
.layer .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layer input { margin: 0; }
.ib { background: none; border: 0; padding: 0; cursor: pointer; font-size: 13px; }

.statusbar { display: flex; gap: 3px; flex: 0 0 auto; padding-top: 2px; }
.statusbar > div { padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.statusbar > .grow { flex: 1; }

.modalbg { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); display: grid; place-items: center; z-index: 50; padding: 12px; }
.modal { max-width: min(640px, 96vw); max-height: 92vh; display: flex; flex-direction: column; padding: 3px; }
.modal .body { padding: 10px 12px; overflow: auto; }
.modal .btns { display: flex; gap: 6px; justify-content: flex-end; padding: 0 12px 10px; flex-wrap: wrap; }
.modal h3 { margin: 10px 0 4px; font-size: 14px; }
.modal p { margin: 4px 0; }
.modal table { border-collapse: collapse; } .modal td { padding: 1px 10px 1px 0; vertical-align: top; }
.presetlist { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.presetlist .btn { text-align: left; }
.toast { position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%); padding: 6px 12px; z-index: 60; max-width: 90vw; }

/* phones and narrow windows: tools across the top, panels below the canvas */
@media (max-width: 820px) {
  .win { inset: 0; }
  .main { flex-direction: column; overflow: auto; }
  .toolbox { width: auto; flex-direction: column; overflow: visible; }
  .tools { display: flex; overflow-x: auto; gap: 2px; padding-bottom: 2px; }
  .tool { flex: 0 0 auto; width: 40px; height: 36px; }
  .opts { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
  .work { flex: 0 0 52vh; min-height: 260px; }
  .side { flex: 0 0 auto; overflow: visible; }
  .titlebar .tip { display: none; }
}

/* Dithry engine: the pixel work behind the paint app, with no page or canvas code, so it also runs in Node.
   A picture is a stack of layers, each an RGBA byte array the size of the canvas. Every tool works the same way:
   it builds a mask (which pixels it touches), then paint() fills the mask with the current style.
   A style is a ramp of 1–4 colours plus a gradient "field": for each pixel, how far along the ramp it is (0..1).
   The field is dithered into the ramp's colours by a threshold pattern, so a smooth gradient becomes pixel art. */
(function (root) {
  'use strict';

  /* ---------------- randomness and noise ---------------- */
  // A small seeded generator (mulberry32), so a style's noise looks the same every time it's drawn.
  function rng(seed) {
    var a = (seed >>> 0) || 1;
    return function () { a = (a + 0x6D2B79F5) >>> 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  // A repeatable random number in [0, 1) for each whole-number point.
  function hash2(x, y, seed) {
    var h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(seed | 0, 1442695041);
    h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  // Smooth value noise in [0, 1), and three octaves of it (fractal noise) for natural-looking turbulence.
  function vnoise(x, y, seed) {
    var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    var a = hash2(xi, yi, seed), b = hash2(xi + 1, yi, seed), c = hash2(xi, yi + 1, seed), d = hash2(xi + 1, yi + 1, seed);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, seed) { return (vnoise(x, y, seed) * 4 + vnoise(x * 2.03, y * 2.03, seed + 7) * 2 + vnoise(x * 4.1, y * 4.1, seed + 13)) / 7; }

  /* ---------------- dither patterns ---------------- */
  // Each pattern gives a threshold in [0, 1) for a pixel. Where the field is above the threshold, the pixel takes the
  // next colour along the ramp; so low thresholds show first and draw the pattern's shapes. x and y are already
  // divided by the pattern's scale. ctx carries the seed, canvas size and a cache.
  function bayer(n) {   // the classic ordered-dither matrix, n = 2, 4 or 8
    var m = [[0]];
    while (m.length < n) {
      var s = m.length, k = [];
      for (var y = 0; y < s * 2; y++) { k.push([]); for (var x = 0; x < s * 2; x++) k[y].push(4 * m[y % s][x % s] + [0, 2, 3, 1][(y < s ? 0 : 2) + (x < s ? 0 : 1)]); }
      m = k;
    }
    return m;
  }
  var B2 = bayer(2), B4 = bayer(4), B8 = bayer(8), HALF = [[12, 5, 6, 13], [4, 0, 1, 7], [11, 3, 2, 8], [15, 10, 9, 14]];
  function mod(a, n) { return ((a % n) + n) % n; }
  function tri(q) { return Math.abs(2 * (q - Math.floor(q)) - 1); }   // 0 at whole numbers, 1 halfway between
  var PATTERNS = [
    { id: 'bayer4', name: 'Bayer 4×4 (cross-hatch)', fn: function (x, y) { return (B4[mod(y, 4)][mod(x, 4)] + .5) / 16; } },
    { id: 'bayer2', name: 'Bayer 2×2 (fine checker)', fn: function (x, y) { return (B2[mod(y, 2)][mod(x, 2)] + .5) / 4; } },
    { id: 'bayer8', name: 'Bayer 8×8 (smooth)', fn: function (x, y) { return (B8[mod(y, 8)][mod(x, 8)] + .5) / 64; } },
    { id: 'halftone', name: 'Halftone dots', fn: function (x, y) { return (HALF[mod(y, 4)][mod(x, 4)] + .5) / 16; } },
    { id: 'diag45', name: 'Cross-hatch at 45°', fn: function (x, y) { return (B4[mod(x + y, 4)][mod(Math.floor((x - y) / 2), 4)] + .5) / 16; } },   // x+y and x−y share parity, so halve one
    { id: 'linesH', name: 'Ruled lines', fn: function (x, y) { return (mod(y, 4) * 4 + [0, 2, 1, 3][mod(x, 4)] + .5) / 16; } },
    { id: 'linesV', name: 'Upright lines', fn: function (x, y) { return (mod(x, 4) * 4 + [0, 2, 1, 3][mod(y, 4)] + .5) / 16; } },
    { id: 'linesD', name: 'Slanted lines', fn: function (x, y) { return (mod(x + y, 4) * 4 + [0, 2, 1, 3][mod(x - y, 4)] + .5) / 16; } },
    { id: 'noise', name: 'Scattered (noise)', fn: function (x, y, c) { return hash2(x, y, c.seed); } },
    { id: 'even', name: 'Even scatter', fn: function (x, y) { var q = .06711056 * x + .00583715 * y; return mod(52.9829189 * (q - Math.floor(q)), 1); } },
    { id: 'masonry', name: 'Masonry', fn: function (x, y) {   // joints darken first, then the stones fill in
      var row = Math.floor(y / 4), yy = mod(y, 4), xx = mod(x + (row & 1 ? 4 : 0), 8);
      return yy === 0 || xx === 0 ? .12 : .45 + (B4[mod(y, 4)][mod(x, 4)] + .5) / 16 * .55; } },
    { id: 'grass', name: 'Wind-bent grass', fn: function (x, y) {
      var q = (y - x * .28 + 2.5 * Math.sin(x * .06 + y * .02)) / 4; return tri(q) * .6 + (B4[mod(y, 4)][mod(x, 4)] + .5) / 16 * .4; } },
    { id: 'swoosh', name: 'Swoosh streaks', fn: function (x, y, c) {
      var up = (c.h - y) / Math.max(1, c.h), q = (x + up * up * c.h * .9) / 5; return .08 + tri(q) * .72 + (B4[mod(y, 4)][mod(x, 4)] + .5) / 16 * .18; } },
    { id: 'waves', name: 'Waves', fn: function (x, y) {
      var q = (y + 1.6 * Math.sin(x * .35)) / 5; return tri(q) * .7 + (B4[mod(y, 4)][mod(x, 4)] + .5) / 16 * .3; } },
    { id: 'vines', name: 'Vines', fn: function (x, y, c) { var m = vineMap(c); return m.t[m.d[mod(y, m.h) * m.w + mod(x, m.w)]]; } },
    { id: 'scales', name: 'Scales', fn: function (x, y) {   // overlapping arcs, like shingles or dragon scales
      var row = Math.floor(y / 4), cx = mod(x + (row & 1 ? 3 : 0), 6) - 3, cy = mod(y, 4); var d = Math.hypot(cx, cy * 1.4);
      return Math.min(.99, Math.abs(d - 2.6) * .35 + .05 + (B4[mod(y, 4)][mod(x, 4)] + .5) / 16 * .2); } }
  ];
  var PATTERN = {}; PATTERNS.forEach(function (p) { PATTERN[p.id] = p; });
  // The vines pattern: sinuous diagonal stems with 45° shoots and leaves, drawn once per seed as a distance map.
  function vineMap(c) {
    var key = 'vines' + c.seed; if (c.cache[key]) return c.cache[key];
    var W = 96, H = 96, d = new Uint8Array(W * H), R = rng(c.seed * 7 + 3), P = 13;
    for (var i = 0; i < W * H; i++) d[i] = 9;
    function dot(x, y, v) { x = mod(Math.round(x), W); y = mod(Math.round(y), H); var k = y * W + x; if (v < d[k]) d[k] = v; }
    for (var s = 0; s < W + H; s += P) {
      var wob = R() * 6.3, side = 1;
      for (var t = -H; t < W + H; t += .5) {
        var w = 1.1 * Math.sin(t * .22 + wob), x = (s + t) / 2 + w * .7, y = (s - t) / 2 + w * .7; dot(x, y, 0);
        if (Math.abs(t % 9) < .25 && R() < .85) {
          side = -side; var sx = side > 0 ? 1 : 0, sy = side > 0 ? 0 : -1, bx = x, by = y;
          for (var b = 1; b <= 6; b++) { bx += sx * .9 + .1; by += sy * .9 - .1; dot(bx, by, 1); }
          dot(bx + sx, by + sy, 0); dot(bx, by, 0);

    for (var pass = 0; pass < 3; pass++) for (var yy = 0; yy < H; yy++) for (var xx = 0; xx < W; xx++) {
      var k = yy * W + xx, m = d[k];
      m = Math.min(m, d[yy * W + mod(xx - 1, W)] + 2, d[mod(yy - 1, H) * W + xx] + 2, d[yy * W + mod(xx + 1, W)] + 2, d[mod(yy + 1, H) * W + xx] + 2);
      d[k] = Math.min(9, m);
    }
    return (c.cache[key] = { w: W, h: H, d: d, t: [.06, .2, .5, .62, .74, .84, .9, .94, .97, .98] });
  }

  /* ---------------- colours ---------------- */
  // '#rrggbb' (or '#rgb') and an alpha 0..1 → [r, g, b, a] bytes.
  function rgba(hex, alpha) {
    var h = String(hex || '#000').replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16) || 0;
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255, Math.round(255 * (alpha == null ? 1 : Math.max(0, Math.min(1, alpha))))];
  }
  function hex(r, g, b) { return '#' + [r, g, b].map(function (v) { return ('0' + (v & 255).toString(16)).slice(-2); }).join(''); }

  /* ---------------- styles ---------------- */
  // The default style: two tones, a top-to-bottom gradient across each shape, Bayer 4×4 dithering.
  function defaultStyle() {
    return {
      mode: 'gradient',                 // 'solid' paints colour 1 only; 'gradient' dithers along the ramp
      ramp: [{ c: '#2a2a3a', a: 1 }, { c: '#8a8aa0', a: 1 }],   // 1–4 colours, from where the field is 0 to where it is 1
      grad: { type: 'linear', anchor: 'shape', angle: 90, x0: 0, y0: 0, x1: 0, y1: 32, start: 0, end: 1, mid: .5, contrast: 1, reverse: true, repeat: 'none', mix: .5 },
      ripple: { amp: 0, freq: 3, phase: 0, turb: 0, turbScale: 12 },
      dither: { pattern: 'bayer4', scale: 1, level: 1, seed: 1 },
      opacity: 1, ditherOpacity: true

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* ---------------- the field ---------------- */
  // Builds field(x, y) → 0..1 for a style over a box {x0, y0, x1, y1} (the shape's bounds, exclusive at the far
  // edge). With anchor 'canvas' the gradient runs between the style's two handles instead. dist, when given, is a
  // distance-from-the-edge map for the 'edge' type.
  function makeField(st, box, dist) {
    var g = st.grad, rp = st.ripple, seed = st.dither.seed | 0;
    var cx = (box.x0 + box.x1) / 2, cy = (box.y0 + box.y1) / 2, hw = Math.max(.5, (box.x1 - box.x0) / 2), hh = Math.max(.5, (box.y1 - box.y0) / 2);
    var canvas = g.anchor === 'canvas', a = (g.angle || 0) * Math.PI / 180, dx = Math.cos(a), dy = Math.sin(a);
    var px0 = g.x0, py0 = g.y0, L = Math.max(.5, Math.hypot(g.x1 - g.x0, g.y1 - g.y0)), ux = (g.x1 - g.x0) / L, uy = (g.y1 - g.y0) / L;
    if (canvas && L <= .5) { ux = 0; uy = 1; }
    var span = g.end - g.start, midExp = g.mid > 0 && g.mid < 1 && Math.abs(g.mid - .5) > .001 ? Math.log(.5) / Math.log(g.mid) : 1, con = Math.max(.02, g.contrast);
    var ext = hw * Math.abs(dx) + hh * Math.abs(dy), pext = hw * Math.abs(dy) + hh * Math.abs(dx), maxD = 1;
    if (dist) for (var i = 0; i < dist.d.length; i++) if (dist.d[i] > maxD && dist.d[i] < 1e8) maxD = dist.d[i];
    return function (x, y) {
      var X = x + .5, Y = y + .5, v, s;   // v: position along the gradient; s: position across it (for ripples)
      switch (g.type) {

  function guideDialog() {

      '<h3>Making a dithered shape</h3><p>Pick two colours in <b>Colours</b> (colour 1 is where the gradient starts). Choose a <b>Gradient</b> type and angle, then draw a rectangle, ellipse or polygon: the gradient spans each shape. <b>Softness</b> sets how wide the blend is; <b>Midpoint</b> pushes it toward one end.</p>' +
      '<h3>Big gradients</h3><p>Use the <b>Gradient tool</b>: drag across the canvas and the whole layer (or the area under your first point) fills along that line. Set <b>Spans</b> to “Gradient-tool handles” to make brushes and shapes use that same line.</p>' +
      '<h3>The look</h3><p><b>Pattern</b> picks the dither (Bayer cross-hatch, halftone, lines, masonry, grass, vines…). <b>Dithering</b> at 0% gives hard bands; 100% blends fully. <b>Ripples</b> bend the frontier into waves, and <b>Turbulence</b> roughens it. <b>Follows the shape’s edge</b> shades from the outline inward. Transparent ramp colours let a style tint what’s underneath.</p>' +
      '<h3>Selections and pictures</h3><p>The <b>Select</b> tool keeps drawing inside a rectangle, which is handy for a gradient over part of a layer. <b>Image → Dither layer by brightness</b> redraws a layer (or the selection) in the style’s colours, so an imported picture becomes dithered pixel art.</p>' +
      '<h3>Layers</h3><p>Put sky, ground, water and buildings on separate layers so you can redo one without the others. Lock a layer to protect it.</p>' +
      '<h3>Kartenspiel card art</h3><p>Start from <b>File → New → Kartenspiel card art</b> (64 × 24), export at 1×, and choose the PNG under <b>Artwork</b> in the Card Builder. Try <b>File → Open the example scene</b> to see how a picture is built up.</p>', null);
  }
  function keysDialog() {
    var rows = TOOLS.map(function (t) { return [t.key, t.name]; }).concat([['[ ]', 'Brush size'], ['X', 'Reverse the colour ramp'], ['Shift', 'Snap lines to 45°; squares and circles'], ['Space (hold)', 'Pan'], ['Enter / Esc', 'Finish / cancel a polygon'], ['+ − 0 1', 'Zoom in, out, fit, actual size'], ['Ctrl+Z / Ctrl+Y', 'Undo / redo'], ['Ctrl+S / Ctrl+O / Ctrl+E', 'Save, open, export'], ['Ctrl+Shift+N', 'New layer'], ['Shift+M', 'Mirror drawing'], ['Delete', 'Clear the layer (or the selection)'], ['Ctrl+A / Ctrl+D', 'Select all / deselect'], ['Ctrl+C / X / V', 'Copy, cut, paste as a new layer'], ['F1', 'Quick guide']]);
    modal('Keyboard shortcuts', '<table>' + rows.map(function (r) { return '<tr><td><b>' + esc(r[0]) + '</b></td><td>' + esc(r[1]) + '</td></tr>'; }).join('') + '</table>');
  }
  function aboutDialog() { modal('About Dithry', '<p><b>Dithry</b> — Pixel Art and Dithered Gradient Tool.</p><p>Made for Kartenspiel, to draw art in the same dithered style as its cards and board. Your work stays in this browser until you save or export it.</p>'); }
  var toastTimer = null;
  function toast(msg) { var t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast raised'; t.setAttribute('role', 'status'); document.body.appendChild(t); } t.textContent = msg; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.style.display = 'none'; }, 3200); }

  /* ---------------- menus ---------------- */
  function closeMenus() { document.querySelectorAll('.mi.open').forEach(function (m) { m.classList.remove('open'); }); }
  function run(cmd) { closeMenus(); if (CMD[cmd]) CMD[cmd](); }

  /* ---------------- keyboard ---------------- */
  function onKey(e) {
    var t = e.target, typing = t && (t.tagName === 'INPUT' && t.type !== 'range' && t.type !== 'checkbox' && t.type !== 'radio' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
    if ($('#modal')) { if (e.key === 'Escape') closeModal(); if (e.key === 'Enter' && !typing) { var d = $('#modal .btn.def'); if (d) d.click(); } return; }
    if (typing) return;
    var c = e.ctrlKey || e.metaKey, k = e.key;
    if (c) {
      var lk = k.toLowerCase();
      if (lk === 'z' && !e.shiftKey) { e.preventDefault(); return undo(); }
      if (lk === 'y' || (lk === 'z' && e.shiftKey)) { e.preventDefault(); return redo(); }
      if (lk === 's') { e.preventDefault(); return saveProject(); }
      if (lk === 'o') { e.preventDefault(); return run('open'); }
      if (lk === 'e') { e.preventDefault(); return exportDialog(); }
      if (lk === 'g') { e.preventDefault(); return run('grid'); }
      if (lk === 'a') { e.preventDefault(); return run('selectAll'); }
      if (lk === 'd') { e.preventDefault(); return run('deselect'); }
      if (lk === 'c') { e.preventDefault(); return run('copy'); }
      if (lk === 'x') { e.preventDefault(); return run('cut'); }
      if (lk === 'v') { e.preventDefault(); return run('paste'); }
      if (lk === 'm') { e.preventDefault(); return run('mergeDown'); }
      if (lk === 'n' && e.shiftKey) { e.preventDefault(); return run('addLayer'); }
      if (lk === 'n' && e.altKey) { e.preventDefault(); return newDialog(); }
      return;
    }
    if (k === ' ') { spaceDown = true; work.classList.add('panning'); e.preventDefault(); return; }
    if (k === 'Escape') { if (op) cancel(); else if (app.sel) run('deselect'); closeMenus(); return; }
    if (k === 'Enter') { if (op && op.kind === 'polygon') { e.preventDefault(); finishPolygon(); } return; }
    if (k === 'Backspace') { if (op && op.kind === 'polygon') { e.preventDefault(); op.pts.pop(); if (!op.pts.length) cancel(); else { polyMask(op.pts); show(); drawOverlay(); } } return; }
    if (k === 'Delete') { e.preventDefault(); return run('clearLayer'); }
    if (k === 'F1') { e.preventDefault(); return guideDialog(); }
    if (k === '+' || k === '=') return zoomStep(1);
    if (k === '-' || k === '_') return zoomStep(-1);
    if (k === '0') return fit();
    if (k === '1') return zoomTo(1);
    if (k === '[') { app.size = Math.max(1, app.size - 1); savePrefs(); renderOpts(); drawOverlay(); return; }
    if (k === ']') { app.size = Math.min(64, app.size + 1); savePrefs(); renderOpts(); drawOverlay(); return; }
    if (k === 'x' || k === 'X') { app.style.ramp.reverse(); savePrefs(); renderSide(); return; }
    if (e.shiftKey && (k === 'M' || k === 'm')) return run('mirror');
    if (e.shiftKey && (k === 'F' || k === 'f')) return run('fillLayer');
    var tl = TOOLS.filter(function (x) { return x.key.toLowerCase() === k.toLowerCase(); })[0];
    if (tl && !e.shiftKey && !e.altKey) setTool(tl.id);
  }
  function setTool(id) { if (op) { if (op.kind === 'polygon') finishPolygon(); else cancel(); } app.tool = id; savePrefs(); renderOpts(); drawOverlay(); }

  /* ---------------- side-panel and option events ---------------- */
  function onSideInput(e) {
    var t = e.target, k = t.getAttribute('data-k');
    if (k) {
      var v = t.type === 'checkbox' ? t.checked : t.tagName === 'SELECT' ? t.value : parseFloat(t.value);
      if (t.type === 'number' && isNaN(v)) return;
      setPath(app.style, k, v);
      var lbl = $('[data-v="' + k + '"]'); if (lbl) { var f = /angle/.test(k) ? '°' : /start|end|mid|contrast|level|opacity|mix/.test(k) ? '%' : /scale$/.test(k) && /dither/.test(k) ? 'x' : ''; lbl.textContent = fmtV(v, f); }
      if (t.tagName === 'SELECT' && /grad\.(type|anchor)/.test(k)) { renderSide(); if (k === 'grad.anchor') drawOverlay(); }
      drawPreview(); savePrefs(); return;
    }
    var a = t.getAttribute('data-act'), sel = app.style.ramp[Math.min(app.rampSel, app.style.ramp.length - 1)];
    if (a === 'colour') { sel.c = t.value; $('[data-act="hex"]').value = t.value; updateRampSwatch(); }
    else if (a === 'hex') { if (/^#?[0-9a-f]{6}$/i.test(t.value.trim())) { sel.c = '#' + t.value.trim().replace('#', '').toLowerCase(); $('[data-act="colour"]').value = sel.c; updateRampSwatch(); } return; }
    else if (a === 'alpha') { sel.a = parseFloat(t.value); $('#alphaV').textContent = Math.round(sel.a * 100) + '%'; updateRampSwatch(); }
    else if (a === 'layerOpacity') { layer().opacity = parseFloat(t.value); $('#lopV').textContent = Math.round(layer().opacity * 100) + '%'; redraw(); touched(); return; }
    else if (a === 'palette' && e.type === 'change') { app.palette = t.value; savePrefs(); renderSide(); return; }
    else if (a === 'preset' && e.type === 'change') {
      var v2 = t.value; if (!v2) return;
      app.style = v2[0] === 'b' ? D.applyPreset(app.style, D.PRESETS[+v2.slice(1)]) : Object.assign(D.defaultStyle(), D.clone(app.userPresets[+v2.slice(1)].s));
      app.rampSel = 0; savePrefs(); renderSide(); toast('Style: ' + t.options[t.selectedIndex].text + '.'); return;
    }
    else if (t.getAttribute('data-mode')) { app.style.mode = t.getAttribute('data-mode'); renderSide(); }
    else if (t.hasAttribute('data-vis')) { var L = app.doc.layers[+t.getAttribute('data-vis')]; L.visible = t.checked; redraw(); touched(); return; }
    drawPreview(); savePrefs();
  }
  function updateRampSwatch() { var b = $('.sw.sel i'); if (b) { var s = app.style.ramp[app.rampSel]; b.style.background = swatchBG(s.c, s.a); } drawPreview(); savePrefs(); }
  function onSideClick(e) {
    if (e.target.tagName === 'INPUT') return;   // checkboxes and fields act through onSideInput
    var t = e.target.closest('button, .ph, .layer'); if (!t) return;
    if (t.classList.contains('ph')) { var p = t.parentNode.getAttribute('data-panel'); app.shut[p] = !app.shut[p]; savePrefs(); renderSide(); return; }
    if (t.hasAttribute('data-cmd')) return run(t.getAttribute('data-cmd'));
    if (t.hasAttribute('data-ramp')) { app.rampSel = +t.getAttribute('data-ramp'); renderSide(); return; }
    if (t.hasAttribute('data-pal')) {
      var r = app.style.ramp[Math.min(app.rampSel, app.style.ramp.length - 1)], c = t.getAttribute('data-pal');
      if (c === 'transparent') r.a = 0; else { r.c = c; if (r.a === 0) r.a = 1; }
      savePrefs(); renderSide(); return;
    }
    if (t.hasAttribute('data-lock')) { var L = app.doc.layers[+t.getAttribute('data-lock')]; L.locked = !L.locked; renderSide(); return; }
    if (t.classList.contains('layer')) { if (op) cancel(); app.doc.active = +t.getAttribute('data-layer'); renderSide(); return; }
    var a = t.getAttribute('data-act'), st = app.style;
    if (a === 'rampAdd' && st.ramp.length < 4) { var last = st.ramp[st.ramp.length - 1]; st.ramp.push({ c: last.c, a: last.a }); app.rampSel = st.ramp.length - 1; }
    else if (a === 'rampDel' && st.ramp.length > 1) { st.ramp.splice(app.rampSel, 1); app.rampSel = Math.min(app.rampSel, st.ramp.length - 1); }
    else if (a === 'rampRev') st.ramp.reverse();
    else if (a === 'dice') st.dither.seed = Math.floor(Math.random() * 99999);
    else if (a === 'keepColour') { var s2 = st.ramp[app.rampSel]; if (app.custom.indexOf(s2.c) < 0) app.custom.push(s2.c); app.palette = 'custom'; toast('Kept ' + s2.c + ' in My colours.'); }
    else if (a === 'savePreset') {
      var m = modal('Save style preset', '<div class="ctl"><span>Name</span><input type="text" id="pN" value="My style ' + (app.userPresets.length + 1) + '"></div>', '<button class="btn" data-close>Cancel</button><button class="btn def" id="pGo">Save</button>');
      $('#pGo', m).onclick = function () { app.userPresets.push({ name: ($('#pN', m).value || 'My style').slice(0, 40), s: D.clone(app.style) }); savePrefs(); closeModal(); renderSide(); toast('Saved the style preset.'); };
      return;
    } else return;
    savePrefs(); renderSide();
  }
  function onSideDbl(e) {
    var row = e.target.closest('.layer'); if (!row) return;
    var i = +row.getAttribute('data-layer'), L = app.doc.layers[i], nm = row.querySelector('.nm');
    nm.innerHTML = '<input type="text" value="' + esc(L.name) + '" style="width:100%">'; var inp = nm.querySelector('input'); inp.focus(); inp.select();
    function done() { L.name = (inp.value || L.name).slice(0, 40); touched(); renderSide(); }
    inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') done(); if (ev.key === 'Escape') renderSide(); ev.stopPropagation(); });
    inp.addEventListener('blur', done);
  }
  function onOpt(e) {
    var t = e.target, k = t.getAttribute('data-opt'); if (!k) return;
    var v = t.type === 'checkbox' ? t.checked : t.type === 'number' ? parseInt(t.value, 10) : t.value;
    if (t.type === 'number' && isNaN(v)) return;
    if (k === 'size') v = clamp(v, 1, 64); if (k === 'tol') v = clamp(v, 0, 255);
    app[k] = v; savePrefs(); if (k === 'shape' || k === 'mirror') renderOpts(); drawOverlay();
  }

  /* ---------------- the example scene ---------------- */
  // A small night prairie, built with the same operations as the tools, layer by layer.
  function exampleScene() {
    newDoc(160, 100, 'transparent', 'Night prairie');
    var w = 160, h = 100, hz = 46, keep = app.style;
    function layerNamed(name) { var d = app.doc; if (d.layers.length === 1 && d.layers[0].name === 'Background' && !d.layers[0].used) { d.layers[0].name = name; d.layers[0].used = true; return; } d.layers.push(D.newLayer(w, h, name)); d.active = d.layers.length - 1; }
    function draw(style, maskFn, fieldBox) { app.style = style; begin('example'); op.box = maskFn(op.mask); show(fieldBox); op = null; }
    function preset(name, over) { var p = D.PRESETS.filter(function (q) { return q.name === name; })[0], s = D.applyPreset(D.defaultStyle(), p); over && over(s); return s; }
    layerNamed('Sky');
    draw(preset('Night sky', function (s) { s.ripple.amp = .04; s.grad.end = 1.05; }), function (m) { return D.rect(m, w, h, 0, 0, w - 1, hz, true, 1); });
    layerNamed('Moon');
    draw(preset('Moonlit glow', function (s) { s.grad.contrast = .7; }), function (m) { return D.ellipse(m, w, h, 112, 4, 136, 28, true, 1); });
    var moon = D.defaultStyle(); moon.mode = 'solid'; moon.ramp = [{ c: '#fff7d6', a: 1 }];
    draw(moon, function (m) { return D.ellipse(m, w, h, 118, 10, 130, 22, true, 1); });
    app.style = moon; begin('example'); op.box = D.ellipse(op.mask, w, h, 122, 8, 133, 20, true, 1); show(null, null, true); op = null;   // carve the crescent
    var star = D.defaultStyle(); star.mode = 'solid'; star.ramp = [{ c: '#e8ecff', a: 1 }]; var R = D.rng(5);
    draw(star, function (m) { var b = null; for (var i = 0; i < 40; i++) { var x = Math.floor(R() * w), y = Math.floor(R() * (hz - 8)); if (Math.hypot(x - 124, y - 16) > 16) b = D.union(b, D.stamp(m, w, h, x, y, 1)); } return b; });
    layerNamed('City');
    var city = D.defaultStyle(); city.ramp = [{ c: '#1a1c26', a: 1 }, { c: '#2a2d3a', a: 1 }]; city.grad.reverse = false; city.grad.contrast = .6; city.dither.pattern = 'masonry';
    draw(city, function (m) {
      var b = D.rect(m, w, h, 46, hz - 6, 104, hz, true, 1);
      for (var x = 46; x < 104; x += 3) b = D.union(b, D.rect(m, w, h, x, hz - 7, x + 1, hz - 7, true, 1));
      [[46, 11], [60, 13], [75, 12], [90, 14], [101, 11]].forEach(function (t) { b = D.union(b, D.rect(m, w, h, t[0], hz - t[1], t[0] + 4, hz, true, 1)); b = D.union(b, D.polygon(m, w, h, [[t[0] - 1, hz - t[1]], [t[0] + 2, hz - t[1] - 5], [t[0] + 5, hz - t[1]]], true, 0)); });
      b = D.union(b, D.rect(m, w, h, 66, hz - 18, 76, hz, true, 1)); b = D.union(b, D.polygon(m, w, h, [[69, hz - 18], [71, hz - 28], [73, hz - 18]], true, 0));
      return b;
    });
    layerNamed('Prairie');
    draw(preset('Wind-bent grass', function (s) { s.ramp = [{ c: '#2f3a2c', a: 1 }, { c: '#141a14', a: 1 }]; s.grad.contrast = 1; s.ripple.amp = .03; s.ripple.freq = 2; }), function (m) { return D.rect(m, w, h, 0, hz + 1, w - 1, h - 1, true, 1); });
    layerNamed('River');
    var pts = [], pts2 = [];
    for (var y = hz + 1; y < h; y += 2) { var t = (y - hz) / (h - hz), cx = 80 + Math.sin(1.6 / (t + .06) + 1.3) * 32 * t, rw = 1 + 24 * Math.pow(t, 1.4); pts.push([Math.round(cx - rw), y]); pts2.unshift([Math.round(cx + rw), y]); }
    pts.push([pts[pts.length - 1][0], h]); pts2.unshift([pts2[0][0], h]);
    draw(preset('River water', function (s) { s.ramp = [{ c: '#8a96b8', a: 1 }, { c: '#3a4462', a: 1 }]; s.grad.reverse = true; s.grad.contrast = .8; }), function (m) { return D.polygon(m, w, h, pts.concat(pts2), true, 0); });
    app.doc.layers.forEach(function (l) { delete l.used; });
    app.style = keep; app.undo = []; app.redo = []; app.dirty = false; redraw(); renderSide(); renderTitle(); fit(); autosave();
    toast('The example scene: each part is on its own layer. Hide layers to see how it’s built.');
  }

  /* ---------------- start-up ---------------- */
  function start() {
    document.getElementById('app').innerHTML = shellHTML();
    art = $('#art'); over = $('#over'); octx = over.getContext('2d'); work = $('#work');
    var saved = lsGet('dithry.autosave');
    var ready = saved ? loadProject(saved).catch(function () { exampleScene(); }) : Promise.resolve(exampleScene());
    app.doc = app.doc || { w: 64, h: 24, active: 0, layers: [D.newLayer(64, 24, 'Background')] };
    if (!saved) { /* exampleScene ran above */ } else setupCanvas();
    renderOpts(); renderSide(); renderTitle();
    ready.then(function () { renderOpts(); window.dithryReady = true; });

    document.querySelectorAll('[data-tool]').forEach(function (b) { b.addEventListener('click', function () { setTool(b.getAttribute('data-tool')); }); });
    $('.menubar').addEventListener('click', function (e) {
      var cmd = e.target.closest('[data-cmd]'); if (cmd) return run(cmd.getAttribute('data-cmd'));
      var mi = e.target.closest('.mi'); if (!mi) return; var was = mi.classList.contains('open'); closeMenus(); if (!was) mi.classList.add('open');
    });
    $('.menubar').addEventListener('mouseover', function (e) { var mi = e.target.closest('.mi'); if (mi && document.querySelector('.mi.open') && !mi.classList.contains('open')) { closeMenus(); mi.classList.add('open'); } });
    document.addEventListener('pointerdown', function (e) { if (!e.target.closest('.menubar')) closeMenus(); }, true);
    var side = $('#side'); side.addEventListener('input', onSideInput); side.addEventListener('change', onSideInput); side.addEventListener('click', onSideClick); side.addEventListener('dblclick', onSideDbl);
    var opts = $('#opts'); opts.addEventListener('change', onOpt); opts.addEventListener('input', onOpt);
    work.addEventListener('pointerdown', onDown); window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', onUp); window.addEventListener('pointercancel', onUp);
    work.addEventListener('dblclick', function () { finishPolygon(); });
    work.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    work.addEventListener('pointerleave', function () { if (!op) { app.hover = null; status(); drawOverlay(); } });
    work.addEventListener('wheel', function (e) { e.preventDefault(); var r = work.getBoundingClientRect(); if (e.ctrlKey || Math.abs(e.deltaY) >= Math.abs(e.deltaX)) { wheelAcc += e.deltaY; if (Math.abs(wheelAcc) >= (e.ctrlKey ? 8 : 40)) { zoomStep(wheelAcc < 0 ? 1 : -1, e.clientX - r.left, e.clientY - r.top); wheelAcc = 0; } } else { app.panX -= e.deltaX; applyView(); } }, { passive: false });
    document.addEventListener('keydown', onKey);
    document.addEventListener('keyup', function (e) { if (e.key === ' ') { spaceDown = false; work.classList.remove('panning'); } });
    window.addEventListener('resize', function () { drawOverlay(); });
    window.addEventListener('beforeunload', function () { if (app.dirty) autosave(); });
  }
  var wheelAcc = 0;
  window.DithryApp = { app: app, run: run, setTool: setTool, flatten: function () { return flatten(); }, projectJSON: projectJSON, loadProject: loadProject };
  start();
})();
</script></body></html>
