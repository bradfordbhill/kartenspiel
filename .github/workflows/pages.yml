# Builds the public site (site/index.html) and publishes it to GitHub Pages on every push to main.
# To point the site at your game server, set a repository variable named KARTENSPIEL_SERVER
# (Settings → Secrets and variables → Actions → Variables), e.g. https://kartenspiel.onrender.com
name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: ./build.sh
        env:
          KARTENSPIEL_SERVER: ${{ vars.KARTENSPIEL_SERVER }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
